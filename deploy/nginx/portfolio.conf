server {
    listen 6400;
    listen [::]:6400;
    server_name 127.0.0.1 localhost;

    root /var/www/portfolio_web/dist;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript application/json image/svg+xml text/css text/javascript;

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.glb$ {
        default_type model/gltf-binary;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /media/ {
        expires off;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / {
        expires off;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    server_name portfolio.moonai.asia;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:6400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/portfolio.moonai.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.moonai.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.moonai.asia;
    return 301 https://$host$request_uri;
}
